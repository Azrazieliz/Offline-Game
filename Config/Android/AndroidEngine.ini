; Embedded Pak data is read through the Android archive reader. The legacy bulk
; loader falls back to resident animation data when mapping is unavailable.
[ConsoleVariables]
mmio.enable=0
; UE 5.8 Vulkan chunked PSO cache can null-dereference in FVulkanCombinedChunkCacheFile::UpdateMapping
; on Android/Adreno during pre-RHI startup. Keep the cache path disabled until the engine fix is available.
r.Vulkan.MemoryMapChunkedPSOCache=0
r.Vulkan.UseChunkedPSOCache=0
