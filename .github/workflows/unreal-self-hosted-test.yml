name: Unreal 5.8 Compile and Tests

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Unreal C++ source
        run: python3 Scripts/verify_unreal_cpp.py

  unreal:
    needs: preflight
    runs-on: [self-hosted, linux, x64, unreal-5.8]
    timeout-minutes: 180
    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@v4
      - name: Verify exact commit again on runner
        run: python3 Scripts/verify_unreal_cpp.py
      - name: Compile and run Unreal automation
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: Scripts/unreal_container_smoke.sh
