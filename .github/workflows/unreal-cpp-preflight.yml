name: Unreal C++ Preflight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Unreal C++ source
        run: python3 Scripts/verify_unreal_cpp.py
